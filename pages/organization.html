<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =====================================================
         PENGATURAN DASAR
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Struktur Organisasi | XII DKV 3</title>


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav>

        <!-- Logo & Nama Kelas -->
        <a
            class="logo"
            href="../index.html"
        >

            <img
                src="../images/logo-kelas.jpg"
                alt="Logo XII DKV 3"
            >

            <span>XII DKV 3</span>

        </a>


        <!-- Tombol Kembali -->
        <a
            href="../index.html"
            class="back-button"
        >
            ← Beranda
        </a>

    </nav>



    <!-- =====================================================
         STRUKTUR ORGANISASI
    ====================================================== -->

    <section class="work-page">


        <!-- Judul Halaman -->

        <h1 class="section-title">
            Struktur
            <span>Kelas</span>
        </h1>



        <!-- =================================================
             GRID ORGANISASI
        ================================================== -->

        <div class="organization">


            <!-- =================================================
                 1. KETUA KELAS
            ================================================== -->

            <div class="org-card">

                <img
                    src="../images/anggota/foto1.jpg"
                    alt="Ketua Kelas"
                >

                <div class="org-info">

                    <h3>
                        Nama Ketua
                    </h3>

                    <p>
                        Ketua Kelas
                    </p>

                </div>

            </div>



            <!-- =================================================
                 2. WAKIL KETUA
            ================================================== -->

            <div class="org-card">

                <img
                    src="../images/anggota/foto2.jpg"
                    alt="Wakil Ketua"
                >

                <div class="org-info">

                    <h3>
                        Nama Wakil
                    </h3>

                    <p>
                        Wakil Ketua
                    </p>

                </div>

            </div>



            <!-- =================================================
                 3. SEKRETARIS 1
            ================================================== -->

            <div class="org-card">

                <img
                    src="../images/anggota/foto3.jpg"
                    alt="Sekretaris 1"
                >

                <div class="org-info">

                    <h3>
                        Nama Sekretaris 1
                    </h3>

                    <p>
                        Sekretaris 1
                    </p>

                </div>

            </div>



            <!-- =================================================
                 4. SEKRETARIS 2
            ================================================== -->

            <div class="org-card">

                <img
                    src="../images/anggota/foto4.jpg"
                    alt="Sekretaris 2"
                >

                <div class="org-info">

                    <h3>
                        Nama Sekretaris 2
                    </h3>

                    <p>
                        Sekretaris 2
                    </p>

                </div>

            </div>



            <!-- =================================================
                 5. BENDAHARA
            ================================================== -->

            <div class="center-2">


                <!-- Bendahara 1 -->

                <div class="org-card">

                    <img
                        src="../images/anggota/foto5.jpg"
                        alt="Bendahara 1"
                    >

                    <div class="org-info">

                        <h3>
                            Nama Bendahara 1
                        </h3>

                        <p>
                            Bendahara 1
                        </p>

                    </div>

                </div>


                <!-- Bendahara 2 -->

                <div class="org-card">

                    <img
                        src="../images/anggota/foto6.jpg"
                        alt="Bendahara 2"
                    >

                    <div class="org-info">

                        <h3>
                            Nama Bendahara 2
                        </h3>

                        <p>
                            Bendahara 2
                        </p>

                    </div>

                </div>

            </div>

    </section>
    <!-- END .work-page -->



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/main.js"></script>


</body>

</html>
