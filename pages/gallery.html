<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeri | XII DKV 3</title>

    <!-- CSS UTAMA -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- CSS GALERI FULLSCREEN -->
    <style>

        /* =================================
           GALLERY
        ================================= */

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            cursor: pointer;
            aspect-ratio: 4 / 3;
            background: #111827;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform .4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.07);
        }

        .gallery-item:last-child {
            grid-column: 2;
        }

        /* =================================
           FULLSCREEN VIEWER
        ================================= */

        .gallery-viewer {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, .96);

            z-index: 99999;

            display: none;

            align-items: center;
            justify-content: center;
        }

        .gallery-viewer.active {
            display: flex;
        }


        /* FOTO BESAR */

        .gallery-viewer img {
            max-width: 85vw;
            max-height: 85vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 8px;

            user-select: none;

            box-shadow: 0 10px 50px rgba(0, 0, 0, .6);

            transition: opacity .2s ease;
        }


        /* =================================
           CLOSE BUTTON
        ================================= */

        .gallery-close {
            position: absolute;

            top: 20px;
            right: 25px;

            width: 52px;
            height: 52px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, .12);

            color: white;

            font-size: 32px;

            cursor: pointer;

            z-index: 10;

            transition: .3s;
        }

        .gallery-close:hover {
            background: #ef4444;
            transform: rotate(90deg);
        }

        

        /* =================================
           PREVIOUS & NEXT
        ================================= */

        .gallery-prev,
        .gallery-next {

            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 60px;
            height: 60px;

            border: none;

            border-radius: 50%;

            background: rgba(255, 255, 255, .12);

            color: white;

            font-size: 42px;

            cursor: pointer;

            z-index: 10;

            transition: .3s;
        }


        .gallery-prev:hover,
        .gallery-next:hover {
            background: #38bdf8;

            transform: translateY(-50%) scale(1.08);
        }


        .gallery-prev {
            left: 25px;
        }


        .gallery-next {
            right: 25px;
        }


        /* =================================
           PHOTO COUNTER
        ================================= */

        .gallery-counter {

            position: absolute;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            padding: 8px 16px;

            border-radius: 20px;

            background: rgba(0, 0, 0, .7);

            color: white;

            font-size: 14px;

            z-index: 10;
        }


        /* =================================
           DOWNLOAD BUTTON
        ================================= */

        .gallery-download {
            position: absolute;
            bottom: 25px;
            right: 25px;

            padding: 12px 20px;

            border: none;
            border-radius: 12px;

            background: rgba(255, 255, 255, .12);

            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            z-index: 10;

            transition: .3s;
        }

        .gallery-download:hover {
            background: #38bdf8;
            transform: translateY(-3px) scale(1.08);
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .gallery-item:last-child {
                grid-column: 1 / -1;
                width: calc(50% - 6px);
                justify-self: center;
            }

            .gallery-viewer img {

                max-width: 92vw;

                max-height: 78vh;

            }


            .gallery-prev,
            .gallery-next {

                width: 45px;
                height: 45px;

                font-size: 30px;

            }


            .gallery-prev {
                left: 10px;
            }


            .gallery-next {
                right: 10px;
            }


            .gallery-close {

                top: 15px;

                right: 15px;

                width: 45px;

                height: 45px;

                font-size: 28px;

            }

            .gallery-download {
                right: 15px;
                bottom: 20px;

                padding: 10px 15px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================== NAVBAR ==================== -->

    <nav>

        <a class="logo" href="../index.html">

            <img
                src="../images/logo-kelas.jpg"
                alt="Logo"
            >

            <span>XII DKV 3</span>

        </a>


        <a
            href="../index.html"
            class="back-button"
        >
            ← Beranda
        </a>

    </nav>



    <!-- ==================== GALERI ==================== -->

    <section class="work-page">


        <h1 class="section-title">

            Memories <span>Kelas</span>

        </h1>



        <!-- DAFTAR FOTO -->

        <div class="gallery">


            <!-- FOTO 1 -->

            <div class="gallery-item">

                <img
                    src="../images/gallery/gallery1.JPEG"
                    alt="Kegiatan 1"
                >

            </div>



            <!-- FOTO 2 -->

            <div class="gallery-item">

                <img
                    src="../images/gallery/gallery2.JPEG"
                    alt="Kegiatan 2"
                >

            </div>



            <!-- FOTO 3 -->

            <div class="gallery-item">

                <img
                    src="../images/gallery/gallery3.JPEG"
                    alt="Kegiatan 3"
                >

            </div>



            <!-- FOTO 4 -->

            <div class="gallery-item">

                <img
                    src="../images/gallery/gallery4.JPEG"
                    alt="Kegiatan 4"
                >

            </div>



            <!-- FOTO 5 -->

            <div class="gallery-item">

                <img
                    src="../images/gallery/gallery5.JPEG"
                    alt="Kegiatan 5"
                >

            </div>



            <!-- FOTO 6 -->

            <!--
            <div class="gallery-item">

                <img
                    src="../images/gallery/gallery6.jpg"
                    alt="Kegiatan 6"
                >

            </div>
            -->


        </div>

    </section>



    <!-- =========================================
         FULLSCREEN GALLERY VIEWER
    ========================================== -->

    <div
        class="gallery-viewer"
        id="galleryViewer"
    >


        <!-- CLOSE -->

        <button
            class="gallery-close"
            id="galleryClose"
            aria-label="Tutup"
        >
            ×
        </button>



        <!-- PREVIOUS -->

        <button
            class="gallery-prev"
            id="galleryPrev"
            aria-label="Foto sebelumnya"
        >
            ‹
        </button>



        <!-- FOTO -->

        <img
            id="galleryViewerImage"
            src=""
            alt="Foto Memories"
        >



        <!-- NEXT -->

        <button
            class="gallery-next"
            id="galleryNext"
            aria-label="Foto berikutnya"
        >
            ›
        </button>

        <!-- DOWNLOAD -->
        <button
            class="gallery-download"
            id="galleryDownload"
            aria-label="Download foto"
            title="Download foto"
        >
            Download Foto
        </button>



        <!-- COUNTER -->

        <div
            class="gallery-counter"
            id="galleryCounter"
        >
            1 / 5
        </div>


    </div>



    <!-- ==================== JAVASCRIPT ==================== -->

    <script>

        /* =================================
           AMBIL SEMUA FOTO
        ================================= */

        const galleryItems =
            document.querySelectorAll(".gallery-item img");


        const viewer =
            document.getElementById("galleryViewer");


        const viewerImage =
            document.getElementById("galleryViewerImage");


        const closeButton =
            document.getElementById("galleryClose");


        const prevButton =
            document.getElementById("galleryPrev");


        const nextButton =
            document.getElementById("galleryNext");


        const downloadButton =
            document.getElementById("galleryDownload");


        const counter =
            document.getElementById("galleryCounter");


        let currentIndex = 0;



        /* =================================
           BUKA FOTO
        ================================= */

        function openGallery(index) {

            currentIndex = index;

            updateGallery();


            viewer.classList.add("active");


            /* Kunci scroll halaman */

            document.body.style.overflow = "hidden";


            /*
             * Coba masuk fullscreen browser.
             * Jika browser tidak mengizinkan,
             * viewer tetap memenuhi layar.
             */

            if (viewer.requestFullscreen) {

                viewer.requestFullscreen()
                    .catch(() => {});

            }

        }



        /* =================================
           UPDATE FOTO
        ================================= */

        function updateGallery() {

            const image =
                galleryItems[currentIndex];


            viewerImage.src =
                image.src;


            viewerImage.alt =
                image.alt;


            counter.textContent =
                `${currentIndex + 1} / ${galleryItems.length}`;

        }



        /* =================================
           NEXT
        ================================= */

        function nextPhoto() {

            currentIndex++;


            if (
                currentIndex >=
                galleryItems.length
            ) {

                currentIndex = 0;

            }


            updateGallery();

        }



        /* =================================
           PREVIOUS
        ================================= */

        function previousPhoto() {

            currentIndex--;


            if (currentIndex < 0) {

                currentIndex =
                    galleryItems.length - 1;

            }


            updateGallery();

        }



        /* =================================
           DOWNLOAD FOTO
        ================================= */

        async function downloadPhoto() {

            const image = galleryItems[currentIndex];

            const fileName =
                "XII-DKV-3-Memories-" +
                (currentIndex + 1) +
                ".jpg";

            try {

                const response = await fetch(image.src);

                if (!response.ok) {
                    throw new Error("Gagal mengambil foto.");
                }

                const blob = await response.blob();

                const blobUrl =
                    URL.createObjectURL(blob);

                const link =
                    document.createElement("a");

                link.href = blobUrl;
                link.download = fileName;

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                URL.revokeObjectURL(blobUrl);

            } catch (error) {

                /* Fallback */
                const link =
                    document.createElement("a");

                link.href = image.src;
                link.download = fileName;

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            }

        }



        /* =================================
           CLOSE
        ================================= */

        function closeGallery() {

            viewer.classList.remove("active");


            document.body.style.overflow = "";


            /*
             * Keluar dari browser fullscreen
             */

            if (document.fullscreenElement) {

                document.exitFullscreen()
                    .catch(() => {});

            }

        }



        /* =================================
           KLIK SETIAP FOTO
        ================================= */

        galleryItems.forEach(
            (image, index) => {

                image.addEventListener(
                    "click",
                    () => {

                        openGallery(index);

                    }
                );

            }
        );



        /* =================================
           TOMBOL NEXT
        ================================= */

        nextButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                nextPhoto();

            }
        );



        /* =================================
           TOMBOL PREVIOUS
        ================================= */

        prevButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                previousPhoto();

            }
        );

        /* =================================
           TOMBOL DOWNLOAD
        ================================= */

        downloadButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                downloadPhoto();

            }
        );



        /* =================================
           TOMBOL CLOSE
        ================================= */

        closeButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                closeGallery();

            }
        );



        /* =================================
           KLIK BACKGROUND
        ================================= */

        viewer.addEventListener(
            "click",
            (event) => {

                if (
                    event.target === viewer
                ) {

                    closeGallery();

                }

            }
        );



        /* =================================
           KEYBOARD
        ================================= */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    !viewer.classList.contains("active")
                ) {

                    return;

                }


                /* Panah kanan */

                if (
                    event.key === "ArrowRight"
                ) {

                    nextPhoto();

                }


                /* Panah kiri */

                if (
                    event.key === "ArrowLeft"
                ) {

                    previousPhoto();

                }


                /* ESC */

                if (
                    event.key === "Escape"
                ) {

                    closeGallery();

                }

            }
        );

    </script>



    <!-- JS UTAMA WEBSITE -->

    <script src="../js/main.js"></script>


</body>

</html>
